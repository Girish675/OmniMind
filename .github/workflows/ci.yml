name: OmniMind CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-and-web-tests:
    name: Local Server & Web Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Server API & Integration Tests
        run: |
          node --test server/test/*.test.js

      - name: Build Web Application
        run: |
          cd web
          npm ci
          npm run build

  android-build-and-test:
    name: Android Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew test

      - name: Assemble Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnimind-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
